name: Android build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: '署名付きAPKをReleaseへ公開する（Secrets登録後）'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify release signing with a disposable test key
        shell: bash
        run: |
          export KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          export KEYSTORE_PATH="$RUNNER_TEMP/test-signing.p12"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD -alias zipbackup -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=CI disposable test key'
          gradle --no-daemon assembleRelease
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ZipBackUp-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Explain release setup
        run: |
          echo '検証APKは開発用です。本番のGoogle登録には使用しないでください。' >> "$GITHUB_STEP_SUMMARY"
          echo '署名Secrets登録後、Run workflowでreleaseを有効にするとReleaseへ公開します。docs/SETUP.mdを参照してください。' >> "$GITHUB_STEP_SUMMARY"
  android16:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android16-device-test
          path: |
            app/build/reports/androidTests/
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [verify, android16]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing secrets
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_PASSWORD" || -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::KEYSTORE_PASSWORD と KEYSTORE_BASE64 を登録してください。docs/SETUP.md を参照。'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Decode signing key
        shell: bash
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and prepare assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/ZipBackUp.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs release-assets/ZipBackUp.apk > release-assets/signing-certificate.txt
          cd release-assets
          sha256sum ZipBackUp.apk > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          AES-256 ZIPで、選択した端末内フォルダをGoogle Driveへバックアップします。

          - モバイルデータ通信の許可切り替え（初期設定はWi-Fiのみ）
          - 定期・手動バックアップ、充電条件、最新7回分の保持
          - 暗号化ZIPの検証と、新規フォルダへの復元

          初回は docs/SETUP.md に従ってGoogle CloudへAndroidアプリを登録してください。
          パッケージ名: io.github.a14398138.zipbackup
          登録用SHA-1は添付の signing-certificate.txt を参照してください。

          自動テスト・Lint・APK署名検証を実施済み。Poco F7でのGoogle接続、定期実行、復元は実機確認が必要です。
          NOTES
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --title "ZipBackUp $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12"
